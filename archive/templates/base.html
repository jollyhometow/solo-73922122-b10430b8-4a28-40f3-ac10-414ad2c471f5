<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}科研数据归档{% endblock %}</title>
<style>
:root { --bg:#f6f7f9; --card:#fff; --line:#d9dde3; --ink:#1f2933;
        --ok:#1a7f4b; --bad:#b42318; --warn:#b54708; --muted:#667085; }
* { box-sizing: border-box; }
body { margin:0; font-family: "Segoe UI","PingFang SC","Microsoft YaHei",
        sans-serif; background:var(--bg); color:var(--ink); }
header { background:#10243e; color:#fff; padding:14px 24px;
         display:flex; gap:20px; align-items:center; }
header a { color:#cfe0ff; text-decoration:none; font-size:14px; }
header a:hover { color:#fff; }
header h1 { font-size:18px; margin:0; flex:1; }
main { max-width:1080px; margin:24px auto; padding:0 16px; }
.card { background:var(--card); border:1px solid var(--line);
        border-radius:10px; padding:20px; margin-bottom:20px; }
h2 { margin-top:0; font-size:17px; }
table { width:100%; border-collapse:collapse; font-size:14px; }
th,td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line);
        vertical-align:top; }
th { color:var(--muted); font-weight:600; }
input,button { font-size:14px; padding:8px 10px; border-radius:6px;
        border:1px solid var(--line); }
button { background:#1d4ed8; color:#fff; border:none; cursor:pointer;
         padding:8px 18px; }
button.secondary { background:#475467; }
button:disabled { opacity:.55; cursor:not-allowed; }
.pill { display:inline-block; padding:2px 10px; border-radius:999px;
        font-size:12px; font-weight:600; }
.pill.complete { background:#d1fadf; color:var(--ok); }
.pill.pending  { background:#fef0c7; color:var(--warn); }
.pill.incomplete { background:#fee4e2; color:var(--bad); }
.pill.bad { background:#fee4e2; color:var(--bad); }
.pill.good { background:#d1fadf; color:var(--ok); }
.mono { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px;
        word-break:break-all; }
.muted { color:var(--muted); font-size:13px; }
.row { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
#msg { margin-top:12px; font-size:14px; white-space:pre-wrap; }
.ok { color:var(--ok); } .bad { color:var(--bad); } .warn { color:var(--warn); }
code { background:#eef1f4; padding:1px 5px; border-radius:4px; }
</style>
</head>
<body>
<header>
  <h1>科研数据归档系统</h1>
  <a href="/">上传与批次</a>
  <a href="/verify">独立核查</a>
</header>
<main>
{% block body %}{% endblock %}
</main>
{% block script %}{% endblock %}
</body>
</html>
